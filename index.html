<!doctype html>
<html lang="de" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CINDER</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14233c;
        overflow: hidden;
        color: #f4f7ff;
        font-family: "Trebuchet MS", "Verdana", sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .panel {
        background: #1c3358;
        border: 5px solid #1b2437;
        border-radius: 18px;
      }
      #hud .tl {
        position: absolute;
        top: 22px;
        left: 22px;
        padding: 12px 18px;
      }
      #hud h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: 0.2em;
        font-weight: 800;
        color: #ffd15a;
      }
      #hud .sub {
        margin-top: 3px;
        font-size: 13px;
        color: #9db4d4;
      }
      #gold {
        position: absolute;
        top: 22px;
        right: 22px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
      }
      .coin {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #ffd15a;
        border: 4px solid #1b2437;
      }
      #gold .label {
        font-size: 11px;
        letter-spacing: 0.16em;
        color: #ffd15a;
      }
      #goldVal {
        font-size: 22px;
        font-weight: 800;
      }
      #shop {
        position: absolute;
        left: 22px;
        bottom: 22px;
        padding: 14px 16px 16px;
        pointer-events: auto;
        width: 220px;
      }
      #shop p {
        margin: 0 0 10px;
        color: #9db4d4;
        font-size: 13px;
      }
      #shop strong {
        color: #f4f7ff;
      }
      #buyUfo {
        width: 100%;
        border: 5px solid #1b2437;
        background: #8be05a;
        color: #1b2437;
        font: 800 16px "Trebuchet MS", sans-serif;
        border-radius: 14px;
        padding: 10px 8px;
        cursor: pointer;
      }
      #buyUfo:disabled {
        background: #4f6a5a;
        color: #1b2437;
        cursor: default;
      }
      #meters {
        position: absolute;
        right: 22px;
        bottom: 22px;
        width: 230px;
        padding: 12px 14px;
      }
      .meter label {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        letter-spacing: 0.12em;
        color: #9db4d4;
        margin-bottom: 5px;
      }
      .track {
        height: 14px;
        background: #14233c;
        border: 4px solid #1b2437;
        border-radius: 99px;
        overflow: hidden;
        margin-bottom: 10px;
      }
      .fill {
        height: 100%;
        width: 100%;
        background: #3dcec5;
      }
      #shotsVal,
      #ufoVal {
        font-weight: 800;
        color: #f4f7ff;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud">
      <div class="tl panel">
        <h1>CINDER</h1>
        <div class="sub">Flat · UFO-Schwarm</div>
      </div>
      <div id="gold" class="panel">
        <div class="coin"></div>
        <div>
          <div class="label">GOLD</div>
          <div id="goldVal">40</div>
        </div>
      </div>
      <div id="shop" class="panel">
        <p><strong id="ufoVal">1</strong> UFOs · <span id="incomeVal">+3/s</span></p>
        <button id="buyUfo" type="button">UFO holen · 30</button>
      </div>
      <div id="meters" class="panel">
        <label><span>PLANET</span><span id="planetVal">100%</span></label>
        <div class="track"><div id="planetFill" class="fill"></div></div>
        <label><span>SCHÜSSE</span><span id="shotsVal">0</span></label>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
